{% extends 'base.html' %}
{% block content %}
  <a href="{{ url_for('managers.dashboard') }}">&larr; Back to Dashboard</a>

  <h1 class="mt-4">Top K Clients</h1>

  <form method="post" class="form-inline my-4">
    <label for="k">Show top</label>
    <input
      type="number"
      id="k"
      name="k"
      min="1"
      class="form-control mx-2"
      placeholder="K"
      value="{{ k or '' }}"
      required
    >
    <label>clients</label>
    <button type="submit" class="btn btn-primary ml-3">Go</button>
  </form>

  {% if results %}
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Email</th>
          <th>Name</th>
          <th>Rental Count</th>
        </tr>
      </thead>
      <tbody>
        {% for row in results %}
          <tr>
            <td>{{ row.email }}</td>
            <td>{{ row.name }}</td>
            <td>{{ row.rental_count }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% elif k %}
    <p class="text-muted">No clients found for K = {{ k }}.</p>
  {% endif %}
{% endblock %}
