<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden; /* Prevent horizontal scrolling */
        }
        .topbar {
            width: 100%;
            background-color: #FFD700; /* Yellow */
            display: flex;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            position: relative;
        }
        .menu {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 0;
            padding: 0;
        }
        .menu li {
            color: black;
            font-size: 18px;
            cursor: pointer;
        }
        .menu li:hover {
            text-decoration: underline;
        }
        .profile {
            position: relative;
            display: inline-block;
        }

        .profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* New: Hover over profile keeps dropdown visible */
        .profile:hover .dropdown {
            display: block;
        }

        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 5px;
            min-width: 120px;
            text-align: center;
            z-index: 999;
        }

        .dropdown a {
            display: block;
            color: black;
            padding: 10px;
            text-decoration: none;
        }

        .dropdown a:hover {
            background-color: #f1f1f1;
        }


        .main {
            margin-top: 80px;
            text-align: center;
            padding: 20px;
        }
        .welcome {
        font-size: 60px;
        margin-bottom: 40px;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .button-container button {
            padding: 18px 36px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        .button-container button:hover {
            background-color: #45a049;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .menu {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
            .profile {
                margin-top: 10px;
            }
            .main {
                margin-top: 100px;
            }
        }
        .car-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Always 3 columns */
            gap: 30px;
            padding: 20px;
            justify-items: center;
        }
        .car-card {
            background-color: #f9f9f9;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 20px;
        }
        .car-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            object-position: center;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .car-card button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .car-card button:hover {
            background-color: #45a049;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 10px;
            width: 50%;
            text-align: center;
        }
        #close-btn {
            color: red;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

    </style>
</head>
<body>






<div class="topbar">
    <ul class="menu">
        <li>My Rent</li>
        <li>My Credit Card</li>
        <li onclick="openAddressForm()">My Address</li>
    </ul>
    <div class="profile">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Profile" />
        <div class="dropdown" id="dropdown">
            <a href="/">Log Out</a>
        </div>
    </div>
</div>
<div class="main">
  <div class="welcome">Welcome Client Name!</div>

  <div class="car-grid">
      <!-- Car 1 -->
      <div class="car-card">
          <img src="https://images.pexels.com/photos/27639321/pexels-photo-27639321/free-photo-of-the-left-front-view-of-the-kia-k5-stopped-in-front-of-a-green-glass-building.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2">
          <button class="book-btn" data-brand="Kia">Book</button>
      </div>
      <!-- Car 2 -->
      <div class="car-card">
          <img src="https://images.pexels.com/photos/2036544/pexels-photo-2036544.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Car 2">
          <button class="book-btn" data-brand="Toyota">Book</button>
      </div>
      <!-- Car 3 -->
      <div class="car-card">
          <img src="https://images.pexels.com/photos/892522/pexels-photo-892522.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Car 3">
          <button class="book-btn" data-brand="BMW">Book</button>
      </div>
      <!-- Car 4 -->
      <div class="car-card">
          <img src="https://images.pexels.com/photos/1719647/pexels-photo-1719647.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Car 4">
          <button class="book-btn" data-brand="Audi">Book</button>
      </div>
      <!-- Car 5 -->
      <div class="car-card">
          <img src="https://images.pexels.com/photos/13101566/pexels-photo-13101566.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Car 5">
          <button class="book-btn" data-brand="Mercedes">Book</button>
      </div>
      <!-- Car 6 -->
      <div class="car-card">
          <img src="https://images.pexels.com/photos/30306584/pexels-photo-30306584/free-photo-of-white-electric-car-on-abu-dhabi-highway.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2">
          <button class="book-btn" data-brand="Tesla">Book</button>
      </div>
      <!-- Car 7 -->
      <div class="car-card">
          <img src="https://images.pexels.com/photos/116675/pexels-photo-116675.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2">
          <button class="book-btn" data-brand="Range Rover">Book</button>
      </div>
      <!-- Car 8 -->
      <div class="car-card">
          <img src="https://images.pexels.com/photos/119435/pexels-photo-119435.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Car 8">
          <button class="book-btn" data-brand="Jeep">Book</button>
      </div>
      <!-- Car 9 -->
      <div class="car-card">
          <img src="https://images.pexels.com/photos/5471133/pexels-photo-5471133.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Car 9">
          <button class="book-btn" data-brand="Volkswagen">Book</button>
      </div>
  </div>
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="close-btn">&times;</span>
      <h2 id="modal-title"></h2>
      <ul id="inventory-list"></ul>
    </div>
  </div>
  <div id="addressModal" class="modal">
    <div class="modal-content">
      <span id="address-close-btn">&times;</span>
      <h2>Enter Your Information</h2>
      <form id="address-form">
        <input type="text" placeholder="Name" id="client-name" required><br><br>
        <input type="email" placeholder="Email" id="client-email" required><br><br>
        <input type="text" placeholder="Address" id="client-address" required><br><br>
        <input type="text" placeholder="Credit Card Number" id="client-card" required><br><br>
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>
</div>
</body>
<script>
  document.querySelectorAll('.book-btn').forEach(button => {
    button.addEventListener('click', function() {
      const brand = this.dataset.brand;
      fetch(`/inventory/${brand}`)
        .then(response => response.json())
        .then(data => {
          document.getElementById('modal-title').innerText = `Available ${brand} Models`;
          const list = document.getElementById('inventory-list');
          list.innerHTML = '';
          data.models.forEach(model => {
            const li = document.createElement('li');
            li.innerText = model;
            list.appendChild(li);
          });
          document.getElementById('modal').style.display = 'block';
        });
    });
  });
  
  document.getElementById('close-btn').onclick = function() {
    document.getElementById('modal').style.display = 'none';
  };
  function openAddressForm() {
    document.getElementById('addressModal').style.display = 'block';
    }

  document.getElementById('address-close-btn').onclick = function() {
      document.getElementById('addressModal').style.display = 'none';
  };

  document.getElementById('address-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('client-name').value;
      const email = document.getElementById('client-email').value;
      const address = document.getElementById('client-address').value;
      const card = document.getElementById('client-card').value;
      console.log('Form submitted:', name, email, address, card);
      alert("Information saved successfully!");
      document.getElementById('addressModal').style.display = 'none';
  });
  </script>  
</html>
